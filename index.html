<!DOCTYPE html>
<html lang="en">
<head>
    <title>Voting Decentralized Application</title>
    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.1/dist/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        button {
            background-color: #2a623d; /* Darker green */
            color: #f0f0f0;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin: 20px auto;
        }

        button:hover {
            background-color: #1f4a2e; /* Even darker on hover */
        }

        p {
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        input[type=text], input[type=number], select {
            width: 30%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: #f0f0f0;
        }

        input[type=submit] {
            background-color: #2a623d;
            color: #f0f0f0;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type=submit]:hover {
            background-color: #1f4a2e;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            padding: 20px;
            background-color: #2c2c2c;
            border-radius: 8px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        span {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .navbar {
            overflow: hidden;
            background-color: #121212;
            font-family: Arial;
        }

        .navbar a {
            float: left;
            display: block;
            color: #f0f0f0;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #333;
            color: #f0f0f0;
        }

        #myTable {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #2c2c2c;
        }

        #myTable th,
        #myTable td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
            color: #f0f0f0;
        }

        #myTable th {
            background-color: #3c3c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/index.html">Vote</a>
        <a href="/ListVoters.html">List Voters</a>
    </div>

    <div class="container">
        <h2>Welcome to the Decentralized Voting Application</h2>
    </div>

    <div class="container">
        <button onclick="connectMetamask()">Connect Metamask</button>
        <p id="metamasknotification"></p>
    </div>

    <div class="container">
        <form onsubmit="addCandidate(event)">
            <span>Add Candidate</span>
            <input type="text" id="candidateName" placeholder="Candidate name">
            <button type="submit">Add Candidate</button>
        </form>
    </div>

    <div class="container">
        <p id="votingStatus"></p>
        <button onclick="getAllCandidates()">List All Candidates</button>
        <p id="p3"></p>
        <table id="myTable">
            <thead>
                <tr>
                    <th>Index</th>
                    <th>Candidate Name</th>
                    <th>Candidate Votes</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="container">
        <p>Time remaining for voting:</p>
        <p id="countdown"></p>
        <span>Vote Here</span>
        <input type="number" id="voteId" placeholder="Index of the Candidate">
        <button onclick="addVote()">Add Vote</button>
        <p id="cand"></p>
        <button onclick="voteStatus()">Check Voting Status</button>
        <p id="status"></p>
        <p id="time"></p>
        <button id="winnerBtn" style="display:none;" onclick="showWinner()">View Winner</button>
        <p id="winnerInfo"></p>
    </div>
</body>
</html>
